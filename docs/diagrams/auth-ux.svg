ox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker><marker id="head-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker><marker id="tail-sky" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/></marker><marker id="head-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="tail-slate" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="322.5" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="30" y="50" width="210" height="128" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><circle cx="135" cy="80" r="17" fill="#2563eb"/><g transform="translate(125.5 70.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g><text x="135" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">새로고침 · 처음 열기</text><text x="135" y="143" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">쿠키로 /auth/refresh</text><text x="135" y="162" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">→ /auth/me 확인</text><circle cx="48" cy="68" r="12" fill="#2563eb"/><text x="48" y="72.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M240 114 L260 114" fill="none" stroke="#475569" stroke-width="1.8"  marker-end="url(#head-slate)"  stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="50" width="210" height="128" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><circle cx="365" cy="80" r="17" fill="#2563eb"/><g transform="translate(355.5 70.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g><text x="365" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">만료 1분 전</text><text x="365" y="143" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">조용히 새 Access 받기</text><text x="365" y="162" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">화면은 그대로</text><circle cx="278" cy="68" r="12" fill="#2563eb"/><text x="278" y="72.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M470 114 L490 114" fill="none" stroke="#475569" stroke-width="1.8"  marker-end="url(#head-slate)"  stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="50" width="210" height="128" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><circle cx="595" cy="80" r="17" fill="#d97706"/><g transform="translate(585.5 70.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></g><text x="595" y="122" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">헤더에 남은 시간</text><text x="595" y="143" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">세션 HH:MM:SS</text><text x="595" y="162" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">24시간에서 줄어듦</text><circle cx="508" cy="68" r="12" fill="#d97706"/><text x="508" y="72.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M700 114 L720 114" fill="none" stroke="#475569" stroke-width="1.8"  marker-end="url(#head-slate)"  stroke-linecap="round" stroke-linejoin="round"/><rect x="720" y="50" width="210" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/><circle cx="825" cy="80" r="17" fill="#e11d48"/><g transform="translate(815.5 70.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="825" y="122" font-size="15" font-weight="700" fill="#881337" text-anchor="middle">세션 끝 · 갱신 실패</text><text x="825" y="143" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">로그인 화면으로</text><text x="825" y="162" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">"로그인이 필요합니다"</text><circle cx="738" cy="68" r="12" fill="#e11d48"/><text x="738" y="72.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="30" y="206" width="440" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="64" cy="240" r="17" fill="#475569"/><g transform="translate(54.5 230.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="90" y="237" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Access 토큰은 탭 메모리에만</text><text x="90" y="259" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">localStorage에 저장하지 않음</text><text x="90" y="278" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">Refresh는 서버가 주는 HttpOnly 쿠키(자바스크립트가 못 읽음)</text><rect x="490" y="206" width="440" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="524" cy="240" r="17" fill="#475569"/><g transform="translate(514.5 230.5) scale(0.7916666666666666)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="550" y="237" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">로그인이 필요한 화면</text><text x="550" y="259" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">로그인 안 됐으면 / 로 보내고 한 번만 안내</text><text x="550" y="278" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">늦게 온 응답은 버림(로그인·로그아웃 직후 꼬임 방지)</text>
</svg>
